<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E3B2E">
<title>50 States</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --sign:      #0E3B2E;
    --sign-lift: #15513C;
    --paper:     #F7F5EF;
    --ink:       #10241C;
    --map-base:  #C7D1CE;
    --map-edge:  #F7F5EF;
    --amber:     #F0A92B;
    --red:       #B3202E;
    --green:     #4C9A5B;
    --muted:     rgba(247, 245, 239, 0.62);
    --r:         14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; overflow-x: hidden; }

  body {
    background: var(--sign);
    color: var(--paper);
    font-family: Overpass, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-weight: 400;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }

  #app {
    height: 100%;
    max-width: 560px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) 14px calc(14px + env(safe-area-inset-bottom));
  }

  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }

  :focus-visible {
    outline: 3px solid var(--amber);
    outline-offset: 3px;
  }

  /* ---------- header ---------- */

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 2px 10px;
  }

  .region-btn {
    font-size: 1.3rem;
    font-weight: 800;
    letter-spacing: -0.015em;
    display: flex;
    align-items: baseline;
    gap: 7px;
  }

  .region-btn .caret { font-size: 0.7em; color: var(--amber); }

  .tally {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .bar {
    height: 4px;
    border-radius: 2px;
    background: rgba(247, 245, 239, 0.16);
    overflow: hidden;
    margin: 0 2px 16px;
  }

  .bar span {
    display: block;
    height: 100%;
    background: var(--amber);
    border-radius: 2px;
    transition: width 0.35s ease;
  }

  /* ---------- map panel ---------- */

  .stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-height: 0;
  }

  .map-panel {
    position: relative;
    display: block;
    width: 100vw;
    left: 50%;
    transform: translateX(-50%);
    aspect-ratio: 975 / 610;
    min-height: 0;
    background: var(--paper);
    border-radius: var(--r);
    padding: 10px;
    text-align: left;
    overflow: hidden;
  }

  .map-panel svg { display: block; width: 100%; height: 100%; }

  .st { fill: var(--map-base); stroke: var(--map-edge); stroke-width: 1.1; }
  .st.on { fill: var(--amber); stroke: #fff; stroke-width: 1.4; }
  .locator { fill: none; stroke: var(--ink); stroke-width: 3; stroke-dasharray: 9 7; opacity: 0.45; }

  .inset {
    position: absolute;
    right: 10px;
    bottom: 10px;
    width: 40%;
    max-width: 170px;
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 8px;
    overflow: hidden;
  }

  .inset svg { display: block; width: 100%; height: auto; }

  .inset b {
    position: absolute;
    left: 0;
    top: 0;
    background: var(--ink);
    color: var(--paper);
    font-size: 0.62rem;
    font-weight: 600;
    padding: 2px 7px 3px;
    border-bottom-right-radius: 7px;
  }

  /* ---------- answer panel ---------- */

  .answer { padding: 2px 2px 0; flex-shrink: 0; }

  .ask {
    font-size: 1.25rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--paper);
    text-align: center;
    padding: 20px 0 6px;
  }

  .ask-sub {
    font-size: 0.88rem;
    font-weight: 600;
    color: var(--muted);
    text-align: center;
    padding-bottom: 22px;
  }

  .reveal { text-align: center; }

  .name {
    font-size: clamp(1.9rem, 9vw, 2.9rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.02;
    color: var(--paper);
    padding: 6px 0 4px;
  }

  .sub {
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--muted);
    padding-bottom: 16px;
    font-variant-numeric: tabular-nums;
  }

  @media (prefers-reduced-motion: no-preference) {
    .reveal .name { animation: rise 0.28s cubic-bezier(0.2, 0.9, 0.3, 1); }
    @keyframes rise {
      from { opacity: 0; transform: translateY(9px); }
      to   { opacity: 1; transform: none; }
    }
  }

  .rate { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .rate button {
    padding: 17px 10px;
    border-radius: var(--r);
    font-size: 1.05rem;
    font-weight: 800;
    letter-spacing: -0.01em;
    transition: transform 0.08s;
  }

  .rate button:active { transform: scale(0.975); }

  .missed { background: var(--red); color: #fff; }
  .got    { background: var(--amber); color: var(--ink); }

  /* ---------- multiple choice (beginner mode) ---------- */

  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }

  .choice {
    padding: 16px 10px;
    border-radius: var(--r);
    background: rgba(247, 245, 239, 0.1);
    color: var(--paper);
    font-size: 1rem;
    font-weight: 800;
    letter-spacing: -0.01em;
    text-align: center;
    transition: transform 0.08s;
  }

  .choice:active { transform: scale(0.975); }
  .choices.answered .choice { cursor: default; }
  .choice.correct { background: var(--green); color: #fff; }
  .choice.wrong { background: var(--red); color: #fff; }

  /* ---------- region list ---------- */

  .sheet { padding: 4px 2px 0; }

  .lede {
    font-size: 1.55rem;
    font-weight: 800;
    letter-spacing: -0.025em;
    line-height: 1.12;
    padding: 6px 0 6px;
  }

  .lede-sub {
    color: var(--muted);
    font-size: 0.95rem;
    padding-bottom: 20px;
    max-width: 44ch;
  }

  .toggle-row {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    text-align: left;
    padding: 15px 4px;
    border-top: 1px solid rgba(247, 245, 239, 0.14);
    border-bottom: 1px solid rgba(247, 245, 239, 0.14);
    margin-bottom: 6px;
  }

  .toggle-row .tname { font-size: 1rem; font-weight: 800; letter-spacing: -0.01em; }
  .toggle-row .tmeta { font-size: 0.8rem; font-weight: 600; color: var(--muted); padding-top: 3px; }

  .switch {
    flex: none;
    width: 46px;
    height: 28px;
    border-radius: 14px;
    background: rgba(247, 245, 239, 0.18);
    position: relative;
    transition: background 0.15s;
  }

  .switch.on { background: var(--amber); }

  .switch .knob {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--paper);
    transition: transform 0.15s;
  }

  .switch.on .knob { transform: translateX(18px); }

  .region-row {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    text-align: left;
    padding: 15px 4px;
    border-top: 1px solid rgba(247, 245, 239, 0.14);
  }

  .region-row:last-of-type { border-bottom: 1px solid rgba(247, 245, 239, 0.14); }
  .region-row[disabled] { opacity: 0.38; cursor: default; }

  .region-row .rname { font-size: 1.1rem; font-weight: 800; letter-spacing: -0.015em; }
  .region-row .rmeta { font-size: 0.8rem; font-weight: 600; color: var(--muted); padding-top: 3px; }
  .region-row .grow { flex: 1; min-width: 0; }

  .ring { flex: none; width: 40px; height: 40px; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 5; }
  .ring .track { stroke: rgba(247, 245, 239, 0.18); }
  .ring .fill { stroke: var(--amber); stroke-linecap: round; transition: stroke-dasharray 0.4s ease; }
  .ring text { display: none; }

  .check { flex: none; width: 40px; text-align: center; font-size: 1.2rem; color: var(--amber); }

  .footer-actions { padding: 26px 2px 6px; display: flex; gap: 18px; align-items: center; }

  .link {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--muted);
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .link.warn { color: #E58C93; }

  /* ---------- region done ---------- */

  .done { text-align: center; padding: 28px 6px; }
  .done .big { font-size: 4.4rem; font-weight: 800; color: var(--amber); line-height: 1; letter-spacing: -0.04em; }
  .done h2 { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em; padding: 12px 0 8px; }
  .done p { color: var(--muted); padding-bottom: 26px; max-width: 34ch; margin: 0 auto; }

  .cta {
    display: block;
    width: 100%;
    padding: 17px;
    border-radius: var(--r);
    background: var(--amber);
    color: var(--ink);
    font-size: 1.05rem;
    font-weight: 800;
  }
</style>
</head>

/* ------------------------------ storage ------------------------------ */

const DB_NAME = 'states-quiz';
let db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('states')) d.createObjectStore('states', { keyPath: 'code' });
      if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', { keyPath: 'k' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function tx(store, mode) {
  return db.transaction(store, mode).objectStore(store);
}

function getAll(store) {
  return new Promise((resolve, reject) => {
    const r = tx(store, 'readonly').getAll();
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}

function put(store, value) {
  return new Promise((resolve, reject) => {
    const r = tx(store, 'readwrite').put(value);
    r.onsuccess = () => resolve();
    r.onerror = () => reject(r.error);
  });
}

function clearStore(store) {
  return new Promise((resolve, reject) => {
    const r = tx(store, 'readwrite').clear();
    r.onsuccess = () => resolve();
    r.onerror = () => reject(r.error);
  });
}

/* ------------------------------ model ------------------------------ */

let cards = {};   // code -> record
let meta = { k: 'progress', region: 'northeast', counter: 0, done: [], beginnerMode: false };

function blank(code) {
  return { code, box: 1, streak: 0, hits: 0, misses: 0, due: 0, capBox: 1, capStreak: 0, capHits: 0, capMisses: 0, capDue: 0 };
}

async function load() {
  db = await openDB();
  const rows = await getAll('states');
  cards = {};
  rows.forEach(r => { if (regionOf[r.code]) cards[r.code] = r; });
  QUIZ_CODES.forEach(c => { cards[c] = Object.assign(blank(c), cards[c]); });

  const m = (await getAll('meta')).find(x => x.k === 'progress');
  if (m) meta = Object.assign(meta, m);
  if (!Array.isArray(meta.done)) meta.done = [];
}

async function saveCard(c) { await put('states', c); }
async function saveMeta() { await put('meta', meta); }

async function resetAll() {
  await clearStore('states');
  await clearStore('meta');
  cards = {};
  QUIZ_CODES.forEach(c => cards[c] = blank(c));
  meta = { k: 'progress', region: 'northeast', counter: 0, done: [], beginnerMode: meta.beginnerMode };
  await saveMeta();
}

const known = code => cards[code].streak >= MASTER_STREAK;

function regionStats(r) {
  const total = r.codes.length;
  const got = r.codes.filter(known).length;
  return { total, got, complete: got === total };
}

function unlocked(index) {
  if (index === 0) return true;
  const prev = REGIONS[index - 1];
  return meta.done.includes(prev.id) || regionStats(prev).complete;
}

/* --------------------------- card selection --------------------------- */

function pick(pool, mode = 'name') {
  if (!pool.length) return null;
  const boxOf = c => mode === 'capital' ? cards[c].capBox : cards[c].box;
  const dueOf = c => mode === 'capital' ? cards[c].capDue : cards[c].due;
  const ready = pool.filter(c => dueOf(c) <= meta.counter);
  const from = ready.length ? ready : [pool.slice().sort((a, b) => dueOf(a) - dueOf(b))[0]];
  // Shakiest first: lowest Leitner box, then whichever has waited longest.
  const rank = (a, b) => (boxOf(a) - boxOf(b)) || (dueOf(a) - dueOf(b));
  const sorted = from.slice().sort(rank);
  const tied = sorted.filter(c => rank(c, sorted[0]) === 0);
  return tied[Math.floor(Math.random() * tied.length)];
}

let current = null;
let cardMode = 'name';   // 'name' | 'capital' — which fact the current card is quizzing
let flipped = false;
let wasReview = false;
let picked = null;
let choiceCache = null;   // { code, options } — keeps a card's shuffled options stable across re-renders

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function choicesFor(code) {
  if (choiceCache && choiceCache.code === code) return choiceCache.options;
  const distractors = shuffle(QUIZ_CODES.filter(c => c !== code)).slice(0, 3);
  const options = shuffle([code, ...distractors]);
  choiceCache = { code, options };
  return options;
}

function nextCard() {
  picked = null;
  const idx = REGIONS.findIndex(r => r.id === meta.region);
  const region = REGIONS[idx];
  const active = region.codes.filter(c => !known(c));

  if (!active.length) { current = null; return; }

  // States already known: earlier regions first, then this region's finished ones.
  // They keep old material warm, and they fill in when the active pool is down to one.
  const filler = REGIONS.slice(0, idx).flatMap(r => r.codes)
    .concat(region.codes.filter(known))
    .filter(c => c !== current);

  const thin = active.length === 1 && active[0] === current;
  if (filler.length && (thin || Math.random() < REVIEW_RATE)) {
    const capital = Math.random() < CAP_RATE;
    const c = pick(filler, capital ? 'capital' : 'name');
    if (c) { current = c; wasReview = true; cardMode = capital ? 'capital' : 'name'; flipped = false; return; }
  }

  let c = pick(active, 'name');
  if (c === current && active.length > 1) {
    c = pick(active.filter(x => x !== current), 'name') || c;
  }
  current = c;
  wasReview = false;
  cardMode = 'name';
  flipped = false;
}

async function answer(hit) {
  const c = cards[current];
  const capital = cardMode === 'capital';
  if (hit) {
    if (capital) { c.capHits++; c.capStreak++; c.capBox = Math.min(3, c.capBox + 1); c.capDue = meta.counter + GAP[c.capBox]; }
    else { c.hits++; c.streak++; c.box = Math.min(3, c.box + 1); c.due = meta.counter + GAP[c.box]; }
  } else {
    if (capital) { c.capMisses++; c.capStreak = 0; c.capBox = 1; c.capDue = meta.counter + MISS_GAP; }
    else { c.misses++; c.streak = 0; c.box = 1; c.due = meta.counter + MISS_GAP; }
  }
  meta.counter++;
  await saveCard(c);
  await saveMeta();

  const region = REGIONS.find(r => r.id === meta.region);
  if (regionStats(region).complete && !meta.done.includes(region.id)) {
    meta.done.push(region.id);
    await saveMeta();
    view = 'done';
    render();
    return;
  }
  nextCard();
  render();
}

/* ------------------------------ map svg ------------------------------ */

function mapSVG(highlight, viewBox, showLocator) {
  const paths = ALL_CODES.map(code =>
    `<path class="st${code === highlight ? ' on' : ''}" d="${GEO[code].d}"/>`
  ).join('');
  let extra = '';
  if (showLocator) {
    const [x, y, w, h] = insetBox(highlight);
    extra = `<rect class="locator" x="${x}" y="${y}" width="${w}" height="${h}" rx="6"/>`;
  }
  return `<svg viewBox="${viewBox}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${paths}${extra}</svg>`;
}

// Square window around a small state, zoomed enough to read but keeping neighbours.
// Nudged to stay inside the map so the locator box never runs off the edge.
const EXTENT = [-62, 8, 964, 612];   // x0, y0, x1, y1 — matches VIEWBOX
const MARGIN = 10;                   // keeps the dashed locator clear of the edge

function insetBox(code) {
  const [x, y, w, h] = GEO[code].b;
  const size = Math.max(w, h, 96) * 1.7;
  const fit = (v, lo, hi) => Math.max(lo + MARGIN, Math.min(v, hi - size - MARGIN));
  return [
    fit(x + w / 2 - size / 2, EXTENT[0], EXTENT[2]),
    fit(y + h / 2 - size / 2, EXTENT[1], EXTENT[3]),
    size, size
  ];
}

/* ------------------------------ views ------------------------------ */

let view = 'home';
const app = document.getElementById('app');
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

function render() {
  if (view === 'home') return renderHome();
  if (view === 'done') return renderDone();
  return renderCard();
}

function renderHome() {
  const totalKnown = QUIZ_CODES.filter(known).length;
  const rows = REGIONS.map((r, i) => {
    const s = regionStats(r);
    const open = unlocked(i);
    const C = 2 * Math.PI * 16;
    const dash = s.total ? (C * s.got / s.total) : 0;
    const badge = s.complete
      ? `<span class="check" aria-hidden="true">✓</span>`
      : `<svg class="ring" viewBox="0 0 40 40" aria-hidden="true">
           <circle class="track" cx="20" cy="20" r="16"/>
           <circle class="fill" cx="20" cy="20" r="16" stroke-dasharray="${dash} ${C}"/>
         </svg>`;
    return `<button class="region-row" data-region="${r.id}" ${open ? '' : 'disabled'}>
      ${badge}
      <span class="grow">
        <span class="rname">${r.name}</span>
        <span class="rmeta">${open ? `${s.got} of ${s.total} known` : `Finish ${REGIONS[i - 1].name} first`}</span>
      </span>
    </button>`;
  }).join('');

  app.innerHTML = `<div class="sheet">
    <h1 class="lede">${totalKnown} of 50 states</h1>
    <p class="lede-sub">Pick a region to practise. A state counts as known once you name it right twice in a row.</p>
    <button class="toggle-row" id="beginnerToggle" aria-pressed="${meta.beginnerMode ? 'true' : 'false'}">
      <span class="grow">
        <span class="tname">Beginner mode</span>
        <span class="tmeta">New states show 4 name choices until known</span>
      </span>
      <span class="switch${meta.beginnerMode ? ' on' : ''}"><span class="knob"></span></span>
    </button>
    ${rows}
    <div class="footer-actions">
      <button class="link warn" id="reset">Start over</button>
    </div>
  </div>`;

  document.getElementById('beginnerToggle').onclick = async () => {
    meta.beginnerMode = !meta.beginnerMode;
    await saveMeta();
    render();
  };

  app.querySelectorAll('[data-region]').forEach(b => {
    b.onclick = async () => {
      meta.region = b.dataset.region;
      await saveMeta();
      const r = REGIONS.find(x => x.id === meta.region);
      if (regionStats(r).complete) { view = 'done'; render(); return; }
      nextCard();
      view = 'card';
      render();
    };
  });

  const reset = document.getElementById('reset');
  let armed = false;
  reset.onclick = async () => {
    if (!armed) {
      armed = true;
      reset.textContent = 'Tap again to erase all progress';
      setTimeout(() => { armed = false; reset.textContent = 'Start over'; }, 3500);
      return;
    }
    await resetAll();
    view = 'home';
    render();
  };
}

function renderCard() {
  if (!current) { view = 'home'; return render(); }
  const region = REGIONS.find(r => r.id === meta.region);
  const s = regionStats(region);
  const c = cards[current];
  const useInset = INSET.has(current);
  const pct = s.total ? (s.got / s.total) * 100 : 0;
  const beginnerCard = meta.beginnerMode && !known(current);

  const insetMarkup = useInset
    ? `<div class="inset">${mapSVG(current, insetBox(current).join(' '), false)}<b>Zoomed in</b></div>`
    : '';

  let answerMarkup;
  let options = null;
  if (beginnerCard) {
    options = choicesFor(current);
    answerMarkup = picked === null
      ? `<p class="ask">Which state is this?</p>
         <p class="ask-sub">Tap the matching name</p>
         <div class="choices">
           ${options.map(code => `<button class="choice" data-code="${code}">${esc(GEO[code].n)}</button>`).join('')}
         </div>`
      : `<div class="reveal">
           <div class="name" aria-live="polite">${esc(GEO[current].n)}</div>
           <div class="sub">${picked === current ? 'Correct!' : `Not quite — you picked ${esc(GEO[picked].n)}`}</div>
           <div class="choices answered">
             ${options.map(code => {
               const cls = code === current ? ' correct' : (code === picked ? ' wrong' : '');
               return `<button class="choice${cls}" disabled>${esc(GEO[code].n)}</button>`;
             }).join('')}
           </div>
           <button class="cta" id="continue">Continue</button>
         </div>`;
  } else if (cardMode === 'capital') {
    answerMarkup = flipped
      ? `<div class="reveal">
           <div class="name" aria-live="polite">${esc(GEO[current].c)}</div>
           <div class="sub">${capSubLine(current, c)}</div>
           <div class="rate">
             <button class="missed" id="miss">Missed it</button>
             <button class="got" id="got">Got it</button>
           </div>
         </div>`
      : `<p class="ask">What's the capital of ${esc(GEO[current].n)}?</p>
         <p class="ask-sub">Say it out loud, then tap the map</p>`;
  } else {
    answerMarkup = flipped
      ? `<div class="reveal">
           <div class="name" aria-live="polite">${esc(GEO[current].n)}</div>
           <div class="sub">${wasReview ? reviewLine(current) : streakLine(c)}</div>
           <div class="rate">
             <button class="missed" id="miss">Missed it</button>
             <button class="got" id="got">Got it</button>
           </div>
         </div>`
      : `<p class="ask">Which state is this?</p>
         <p class="ask-sub">Say it out loud, then tap the map</p>`;
  }

  const revealed = beginnerCard ? picked !== null : flipped;

  app.innerHTML = `
    <header>
      <button class="region-btn" id="back">${region.name}<span class="caret" aria-hidden="true">▾</span></button>
      <span class="tally">${s.got} of ${s.total} known</span>
    </header>
    <div class="bar"><span style="width:${pct}%"></span></div>
    <div class="stage">
      <button class="map-panel" id="flip" ${(beginnerCard || flipped) ? 'disabled' : ''} aria-label="${revealed ? esc(cardMode === 'capital' ? GEO[current].c : GEO[current].n) : (beginnerCard ? 'Which state is highlighted' : (cardMode === 'capital' ? 'Reveal the capital' : 'Reveal the state name'))}">
        ${mapSVG(current, VIEWBOX, useInset)}
        ${insetMarkup}
      </button>
      <div class="answer">${answerMarkup}</div>
    </div>`;

  document.getElementById('back').onclick = () => { view = 'home'; render(); };

  if (beginnerCard) {
    if (picked === null) {
      app.querySelectorAll('.choice').forEach(btn => {
        btn.onclick = () => { picked = btn.dataset.code; render(); };
      });
    } else {
      document.getElementById('continue').onclick = () => answer(picked === current);
    }
  } else {
    const flip = document.getElementById('flip');
    if (!flipped) flip.onclick = () => { flipped = true; render(); };
    if (flipped) {
      document.getElementById('miss').onclick = () => answer(false);
      document.getElementById('got').onclick = () => answer(true);
    }
  }
}

function reviewLine(code) {
  const r = regionOf[code];
  return r === meta.region ? 'Review' : 'Review from the ' + REGIONS.find(x => x.id === r).name;
}

function streakLine(c) {
  if (c.streak === 1) return 'One more right answer and this one is known';
  if (c.misses > 0 && c.streak === 0) return `Missed ${c.misses} time${c.misses > 1 ? 's' : ''} so far`;
  return 'New state';
}

function capSubLine(code, c) {
  if (c.capStreak === 1) return 'One more right answer and this capital is known';
  if (c.capMisses > 0 && c.capStreak === 0) return `Missed ${c.capMisses} time${c.capMisses > 1 ? 's' : ''} so far`;
  const r = regionOf[code];
  return r === meta.region ? 'Capital review' : 'Capital review from the ' + REGIONS.find(x => x.id === r).name;
}

function renderDone() {
  const idx = REGIONS.findIndex(r => r.id === meta.region);
  const region = REGIONS[idx];
  const next = REGIONS[idx + 1];
  const totalKnown = QUIZ_CODES.filter(known).length;

  app.innerHTML = `<div class="done">
    <div class="big">${region.codes.length}</div>
    <h2>${region.name} done</h2>
    <p>${next
      ? `All ${region.codes.length} named twice in a row. ${next.name} is open now — ${next.codes.length} more states, and old ones will keep turning up.`
      : `That is all 50. ${totalKnown === 50 ? 'Every state, twice in a row.' : 'Go back and shore up the regions that slipped.'}`}</p>
    ${next ? `<button class="cta" id="next">Start ${next.name}</button>` : ''}
    <div class="footer-actions" style="justify-content:center">
      <button class="link" id="home">Back to regions</button>
    </div>
  </div>`;

  document.getElementById('home').onclick = () => { view = 'home'; render(); };
  const n = document.getElementById('next');
  if (n) n.onclick = async () => {
    meta.region = next.id;
    await saveMeta();
    nextCard();
    view = 'card';
    render();
  };
}

/* ------------------------------ boot ------------------------------ */

(async function boot() {
  try {
    await load();
  } catch (e) {
    app.innerHTML = `<div class="sheet"><h1 class="lede">Storage is blocked</h1>
      <p class="lede-sub">This browser will not let the app save progress. Turn off private browsing, or allow site data, then reload.</p></div>`;
    return;
  }
  view = 'home';
  render();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
